name: iOS — Simulator regression

# Builds Everytool (app + keyboard, controls, share, broadcast extensions)
# for the iPhone simulator, installs it on a booted iPhone, and runs the
# Maestro regression suite in .maestro/ through scripts/sim/run-e2e.sh.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  unit:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test

  simulator:
    name: Build + run on iPhone simulator
    needs: unit
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Verify native wiring
        run: |
          set -euo pipefail
          grep -q "EverytoolSharedVault" ios/Podfile.lock || { echo "::error::EverytoolSharedVault module is not linked"; exit 1; }
          grep -q "OpenToolIntent.swift in Sources" ios/Everytool.xcodeproj/project.pbxproj || { echo "::error::OpenToolIntent is not in the app target"; exit 1; }
          grep -q "EverytoolIntents.swift in Sources" ios/Everytool.xcodeproj/project.pbxproj || { echo "::error::EverytoolIntents is not in the app target"; exit 1; }

      - name: Pick and boot an iPhone simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = [(rt, x) for rt, xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          pro = [t for t in c if "Pro" in t[1]["name"] and "Max" not in t[1]["name"]] or c
          pro.sort(key=lambda t: (t[0], t[1]["name"]))
          print(pro[-1][1]["udid"])')"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # Software keyboard on, so the Everytool keyboard can show.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace ios/Everytool.xcworkspace \
            -scheme Everytool \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build/sim \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build | tee build/xcodebuild.log | grep -E "error:|warning: .*Everytool|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log

      - name: Verify bundle (extensions + 13 controls)
        run: |
          set -euo pipefail
          APP="build/sim/Build/Products/Release-iphonesimulator/Everytool.app"
          echo "APP=$APP" >> "$GITHUB_ENV"
          ls "$APP/PlugIns"
          for ext in EverytoolKeyboard EverytoolControls EverytoolShare EverytoolBroadcast EverytoolBroadcastUI; do
            test -d "$APP/PlugIns/$ext.appex" || { echo "::error::$ext.appex missing"; exit 1; }
          done
          BIN="$APP/PlugIns/EverytoolControls.appex/EverytoolControls"
          # The ten tool controls share one interpolated kind
          # ("app.everytool.ios.controls.<tool>"); the record control's
          # kind is a literal. Both must be in the binary.
          strings "$BIN" | grep -q "app.everytool.ios.controls.record"
          strings "$BIN" | grep -q "app.everytool.ios.controls.sessionstart"
          strings "$BIN" | grep -q "app.everytool.ios.controls.sessionfinish"
          strings "$BIN" | grep -q "app.everytool.ios.controls."
          # Display names are NOT reliable binary strings: a title of 15
          # bytes or fewer is a Swift small string, inlined into code and
          # never stored contiguously ("Resize Photo", "PDF Tools", ...),
          # while "Clipboard"/"Convert" only matched as substrings of the
          # type names. Assert on what the binary provably carries: each
          # control's type name (Swift type metadata) and its description
          # text (long literals are stored as cstrings).
          for pair in \
            "RecordControl|Start a scrolling capture that Everytool stitches into one image." \
            "StitchControl|Open Everytool's long screenshot stitcher." \
            "ClipboardControl|Open your saved clipboard items." \
            "ConvertControl|Open Everytool's file converter." \
            "QrControl|Make or scan a QR code." \
            "ResizeControl|Shrink a photo to a smaller size." \
            "PdfControl|Merge, split or compress PDFs." \
            "TextControl|Count, extract and clean up text." \
            "DaysControl|Count days between dates." \
            "SplitControl|Split a bill with tax and tip." \
            "GifControl|Turn a short video into a GIF." \
            "StartSessionControl|Start a session: take screenshots while you scroll, then tap Stitch Screenshots." \
            "FinishSessionControl|Join the screenshots you took into one long screenshot."; do
            type_name="${pair%%|*}"; summary="${pair#*|}"
            strings "$BIN" | grep -q "$type_name" || { echo "::error::control type '$type_name' missing"; exit 1; }
            strings "$BIN" | grep -q "$summary" || { echo "::error::control '$type_name' description missing"; exit 1; }
          done
          strings "$BIN" | grep -q "Record Long Screenshot"
          echo "All Control Center controls present."
          strings "$BIN" | grep -q "app.everytool.ios.widgets.countdown" || { echo "::error::Countdown widget missing"; exit 1; }
          echo "Countdown widget present."

      - name: Verify Siri & Shortcuts actions are registered
        run: |
          set -euo pipefail
          META="$APP/Metadata.appintents"
          test -d "$META" || { echo "::error::No App Intents metadata in the app bundle"; exit 1; }
          for intent in OpenEverytoolToolIntent StartLongScreenshotIntent StitchScreenshotsIntent SaveClipIntent GetClipsIntent TextStatsIntent ExtractFromTextIntent DaysUntilIntent SplitBillIntent MakeQRCodeIntent ConvertImageIntent ResizeImageIntent RemoveLocationIntent MergePDFsIntent OpenToolIntent; do
            grep -rqa "$intent" "$META" || { echo "::error::$intent not registered"; exit 1; }
          done
          echo "All 15 App Intents registered."

      - name: Install app, grant photo access, add media
        run: |
          set -euo pipefail
          xcrun simctl install "$UDID" "$APP"
          # STRICT grants (12a diagnostics): a Photos grant that silently
          # did not stick was one of two suspects for the session-start
          # failure, and the old `|| true` hid which. Fail loudly on the
          # grant itself, then read the grant back from the simulator's
          # TCC database so the run log states the resulting auth_value.
          xcrun simctl privacy "$UDID" grant photos app.everytool.ios
          xcrun simctl privacy "$UDID" grant photos-add app.everytool.ios
          TCC_DB="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/TCC/TCC.db"
          if [ -f "$TCC_DB" ]; then
            AUTH="$(sqlite3 "$TCC_DB" "SELECT auth_value FROM access WHERE service='kTCCServicePhotos' AND client='app.everytool.ios' ORDER BY auth_value DESC LIMIT 1;")"
            echo "TCC kTCCServicePhotos for app.everytool.ios: auth_value=${AUTH:-<no row>}"
            { [ -n "$AUTH" ] && [ "$AUTH" != "0" ]; } || { echo "::error::Photos grant did not stick (TCC auth_value=${AUTH:-none})"; exit 1; }
          else
            echo "::warning::TCC database not found at $TCC_DB — grant readback skipped (the grant itself was strict)"
          fi
          node --experimental-strip-types scripts/sim/make-fixtures.ts sim-fixtures
          xcrun simctl addmedia "$UDID" sim-fixtures/photo.png sim-fixtures/shots/*.png

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run regression suite
        run: FX=sim-fixtures OUT=build/e2e scripts/sim/run-e2e.sh

      - name: Upload results (screenshots, JUnit, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-e2e
          path: |
            build/e2e
            build/xcodebuild.log
          if-no-files-found: ignore
