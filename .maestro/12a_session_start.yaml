appId: app.everytool.ios
name: Screenshot session - start
---
- launchApp
# Flow 11 leaves the app ON the stitch screen holding its result —
# launchApp only foregrounds, and the broadcast inbox is cleared only
# when that screen unmounts, so without this the app never reaches
# Home (proven in runs 39365940718 + 39367801274: the home wait
# burned its full 30s; the Back tap fixed it in 39370026286). Go Back
# first if a tool is open; the step is optional because at Home there
# is no "Back".
- tapOn:
    text: "Back"
    optional: true
# Wait for the home grid like 01_home does before tapping.
- extendedWaitUntil:
    visible: "Open Long screenshot"
    timeout: 30000
- tapOn: "Open Long screenshot"
- tapOn: "Screenshots"
# The Start button sits below the long intro card; scroll it into
# view before tapping (no-op when already visible).
- scrollUntilVisible:
    element:
      id: "stitch.session.start"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "stitch.session.start"
# Run 39370026286 got this far and "Session running" never appeared.
# beginSession first awaits MediaLibrary.requestPermissionsAsync —
# if the sim's Photos grant did not stick, iOS presents the access
# prompt and the request stays pending until it is answered. The old
# single optional tap fired immediately after the Start tap, before
# the prompt rendered, so it could never hit it. Answer the prompt
# conditionally, twice (it can take a few seconds to appear on a
# loaded runner), then wait for the session card.
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos"
# Gate diagnostics: if beginSession stopped at the Photos gate, its
# error text is on screen now — name the gate in a screenshot so
# the run artifacts say which one fired. The blocking assertion
# below still decides the flow; the Maestro debug hierarchy in the
# artifacts carries the same text even if a gate text is off-screen.
- runFlow:
    when:
      visible: "needs Photos access to find your screenshots"
    commands:
      - takeScreenshot: 12a-GATE-denied
- runFlow:
    when:
      visible: "stay hidden from Everytool"
    commands:
      - takeScreenshot: 12a-GATE-limited
- runFlow:
    when:
      visible: "needs Full Access to Photos to find your screenshots"
    commands:
      - takeScreenshot: 12a-GATE-full-access
- extendedWaitUntil:
    visible: "Session running.*"
    timeout: 20000
- takeScreenshot: 12a-session-started
