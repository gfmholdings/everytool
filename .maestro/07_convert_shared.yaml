appId: app.everytool.ios
name: Convert - photo arriving from the share sheet (app already running)
---
- openLink: "everytool://tool/convert"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "2400 × 1800"
    timeout: 20000
- tapOn: "Convert to JPG"
- extendedWaitUntil:
    visible: "Done"
    timeout: 30000
- tapOn: "Save to Photos"
- extendedWaitUntil:
    visible: "Saved to Photos"
    timeout: 15000
- tapOn: "PDF"
- tapOn: "Make one PDF"
# 90s (was 30s): run 6ad827f8 on the Codemagic iOS 26 lane was still
# at "Preparing page 1 of 1" when the 30s wait expired — no error, the
# build was simply not done (the JPG stage on the same photo passed
# seconds earlier). If a future run is STILL preparing at 90s, treat
# it as a stall in the pdf build on this OS, not slowness.
- extendedWaitUntil:
    visible: "photos.pdf.*"
    timeout: 90000
# Remove location: lossless copy without GPS, verified natively
- tapOn: "No location"
- tapOn: "Remove location"
- extendedWaitUntil:
    visible: "No location data in the result."
    timeout: 20000
- takeScreenshot: 07-convert
