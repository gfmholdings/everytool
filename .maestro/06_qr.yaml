appId: app.everytool.ios
name: QR - make, copy, share sheet, history
---
- launchApp
- tapOn: "Open QR toolbox"
- tapOn:
    id: "qr.text"
- inputText: "https://example.com/everytool"
# hideKeyboard CANNOT dismiss this screen's keyboard — it failed in
# runs 39363490145 and 39365940718, the second time even after
# waitForAnimationToEnd. Dismiss by switching tabs instead: the Make
# form unmounts, which resigns the input; the typed text lives in
# QrScreen state (not the tab body), so it survives the switch, and
# the field does not auto-focus on return.
- tapOn: "History"
- tapOn: "Make"
- tapOn: "Make QR code"
- assertVisible: "Share"
- tapOn: "Copy text"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 20000
- tapOn: "Share"
- extendedWaitUntil:
    visible: "Save Image|Copy|Save to Files"
    timeout: 15000
- takeScreenshot: 06-qr-share-sheet
- tapOn:
    text: "Close"
    optional: true
- swipe:
    direction: DOWN
    optional: true
- tapOn: "History"
- assertVisible: ".*made.*"
- takeScreenshot: 06-qr-history
