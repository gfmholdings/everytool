appId: app.everytool.ios
name: QR - make, copy, share sheet, history
---
- launchApp
- tapOn: "Open QR toolbox"
- tapOn: "Text or a link"
- inputText: "https://example.com/everytool"
- hideKeyboard
- tapOn: "Make QR code"
- assertVisible: "Share"
- tapOn: "Copy text"
- assertVisible: "Copied"
- tapOn: "Share"
- extendedWaitUntil:
    visible: "Save Image|Copy|Save to Files"
    timeout: 15000
- takeScreenshot: 06-qr-share-sheet
- tapOn:
    text: "Close"
    optional: true
- swipe:
    direction: DOWN
    optional: true
- tapOn: "History"
- assertVisible: ".*made.*"
- takeScreenshot: 06-qr-history
