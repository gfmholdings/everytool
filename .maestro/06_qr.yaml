appId: app.everytool.ios
name: QR - make, copy, share sheet, history
---
- launchApp
- tapOn: "Open QR toolbox"
- tapOn:
    id: "qr.text"
- inputText: "https://example.com/everytool"
# hideKeyboard issued immediately after inputText failed here and in
# 03/09; the one success (04) came after intervening interactions,
# i.e. a settled keyboard. Settle first, then hide. (No plain-text
# dismissal target exists on this tab — only Segmented pressables.)
- waitForAnimationToEnd
- hideKeyboard
- tapOn: "Make QR code"
- assertVisible: "Share"
- tapOn: "Copy text"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 20000
- tapOn: "Share"
- extendedWaitUntil:
    visible: "Save Image|Copy|Save to Files"
    timeout: 15000
- takeScreenshot: 06-qr-share-sheet
- tapOn:
    text: "Close"
    optional: true
- swipe:
    direction: DOWN
    optional: true
- tapOn: "History"
- assertVisible: ".*made.*"
- takeScreenshot: 06-qr-history
