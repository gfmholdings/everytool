appId: app.everytool.ios
name: Clipboard - save, edit, pin, copy, paste, cut, delete
---
- launchApp
- tapOn: "Open Clipboard"
- tapOn:
    id: "clipboard.draft"
- inputText: "Maestro clip one"
# hideKeyboard fails on this screen (run 39363490145). Dismiss instead
# with an unhandled tap on the plain empty-state text — present exactly
# here (zero clips), inside the ScrollView, so under
# keyboardShouldPersistTaps="handled" the tap resigns the input. Same
# pattern that fixed 05/09 in that run.
- tapOn: "Nothing saved yet.*"
- tapOn: "Save text"
- extendedWaitUntil:
    visible: ".*Maestro clip one.*"
    timeout: 20000
# edit
- tapOn: "Edit"
- tapOn:
    id: "clipboard.edit"
- eraseText: 40
- inputText: "Maestro clip edited"
# No hideKeyboard: it fails on this screen. The Save button sits
# directly under the edit field, which iOS auto-scrolls above the
# keyboard when the field is focused — tap Save directly. Anchored:
# bare "Save" also matches the compose button "Save text" earlier in
# the hierarchy, and run 39365940718 died here on exactly that — the
# tap went to the (disabled) compose button and "Clip updated" never
# appeared.
- tapOn: "^Save$"
- extendedWaitUntil:
    visible: "Clip updated"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Maestro clip edited.*"
    timeout: 20000
# pin / unpin
- tapOn: "Pin"
- assertVisible: "Unpin"
- tapOn: "Unpin"
- assertVisible: "Pin"
# copy, then paste into the draft
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 20000
- tapOn: "Paste"
- tapOn:
    text: "Allow Paste"
    optional: true
- extendedWaitUntil:
    visible: ".*Maestro clip edited.*"
    timeout: 20000
- tapOn:
    id: "clipboard.draft"
- eraseText: 40
# (No keyboard dismissal here — the draft is re-focused immediately.)
# a second clip so cut/delete each act on one
- tapOn:
    id: "clipboard.draft"
- inputText: "Maestro clip two"
# No hideKeyboard (fails here); "Save text" sits directly under the
# focused draft field at the top of the screen, above the keyboard.
- tapOn: "Save text"
- extendedWaitUntil:
    visible: ".*Maestro clip two.*"
    timeout: 20000
- takeScreenshot: 03-clipboard-two-clips
# cut the newest (top) clip: removed from the list, now on the clipboard
- tapOn:
    text: "Cut"
    index: 0
- extendedWaitUntil:
    visible: "Cut — it’s on your clipboard"
    timeout: 20000
- extendedWaitUntil:
    visible: "On your clipboard now"
    timeout: 20000
- tapOn: "Save it"
- extendedWaitUntil:
    visible: "Saved to clipboard history"
    timeout: 20000
# delete one
- tapOn:
    text: "Delete"
    index: 0
- takeScreenshot: 03-clipboard-done
