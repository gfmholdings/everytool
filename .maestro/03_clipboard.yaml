appId: app.everytool.ios
name: Clipboard - save, edit, pin, copy, paste, cut, delete
---
- launchApp
- tapOn: "Open Clipboard"
- tapOn:
    id: "clipboard.draft"
- inputText: "Maestro clip one"
- hideKeyboard
- tapOn: "Save text"
- extendedWaitUntil:
    visible: ".*Maestro clip one.*"
    timeout: 20000
# edit
- tapOn: "Edit"
- tapOn:
    id: "clipboard.edit"
- eraseText: 40
- inputText: "Maestro clip edited"
- hideKeyboard
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Clip updated"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Maestro clip edited.*"
    timeout: 20000
# pin / unpin
- tapOn: "Pin"
- assertVisible: "Unpin"
- tapOn: "Unpin"
- assertVisible: "Pin"
# copy, then paste into the draft
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 20000
- tapOn: "Paste"
- tapOn:
    text: "Allow Paste"
    optional: true
- extendedWaitUntil:
    visible: ".*Maestro clip edited.*"
    timeout: 20000
- tapOn:
    id: "clipboard.draft"
- eraseText: 40
- hideKeyboard
# a second clip so cut/delete each act on one
- tapOn:
    id: "clipboard.draft"
- inputText: "Maestro clip two"
- hideKeyboard
- tapOn: "Save text"
- extendedWaitUntil:
    visible: ".*Maestro clip two.*"
    timeout: 20000
- takeScreenshot: 03-clipboard-two-clips
# cut the newest (top) clip: removed from the list, now on the clipboard
- tapOn:
    text: "Cut"
    index: 0
- extendedWaitUntil:
    visible: "Cut — it’s on your clipboard"
    timeout: 20000
- extendedWaitUntil:
    visible: "On your clipboard now"
    timeout: 20000
- tapOn: "Save it"
- extendedWaitUntil:
    visible: "Saved to clipboard history"
    timeout: 20000
# delete one
- tapOn:
    text: "Delete"
    index: 0
- takeScreenshot: 03-clipboard-done
