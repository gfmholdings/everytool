appId: app.everytool.ios
name: Clipboard - save, edit, pin, copy, paste, cut, delete
---
- launchApp
- tapOn: "Open Clipboard"
- tapOn:
    id: "clipboard.draft"
- inputText: "Maestro clip one"
# hideKeyboard fails on this screen (run 39363490145). Dismiss instead
# with an unhandled tap on the plain empty-state text — present exactly
# here (zero clips), inside the ScrollView, so under
# keyboardShouldPersistTaps="handled" the tap resigns the input. Same
# pattern that fixed 05/09 in that run.
- tapOn: "Nothing saved yet.*"
- tapOn: "Save text"
- extendedWaitUntil:
    visible: ".*Maestro clip one.*"
    timeout: 20000
# edit
- tapOn: "Edit"
- tapOn:
    id: "clipboard.edit"
- eraseText: 40
- inputText: "Maestro clip edited"
# Snippet word for this clip (feature pass): the shortcut field is
# in the same edit card, above Save. No hideKeyboard (fails on this
# screen) — scroll-settle onto the field, tap it, type the word,
# then the proven top-edge Save tap below does the rest.
- scrollUntilVisible:
    element:
      id: "clipboard.shortcut"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "clipboard.shortcut"
- inputText: "mcl"
# No hideKeyboard: it fails on this screen. Three runs (39365940718,
# 39367801274, 39370026286) all died at the "Clip updated" wait and
# every run's vault file proves updateClip never ran (the clip stayed
# "Maestro clip one") — the anchored tap is dispatched but eaten.
# Geometry from the styles: header ~115 + draft field (multiline,
# minHeight 140) + button row ~50 + edit card (field 140 + row) puts
# the edit Save button's center at ~y542 on the 874pt screen — right
# at the software keyboard's top edge (~538), so a center tap lands
# on the keyboard, not the button. The content is shorter than the
# viewport, so scrolling cannot lift it (scrollUntilVisible is kept
# only as a settle step). Tap the button's TOP edge instead: ~y522
# is on the button and above the keyboard under either keyboard
# height. (updateClip itself is sound: same commit path as addClip,
# which lands in the vault every run.)
- scrollUntilVisible:
    element:
      text: "^Save$"
    direction: DOWN
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    text: "^Save$"
    point: "50%, 10%"
- extendedWaitUntil:
    visible: "Clip updated"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Maestro clip edited.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*type “mcl” \\+ space in the keyboard.*"
    timeout: 20000
# pin / unpin
- tapOn: "Pin"
- assertVisible: "Unpin"
- tapOn: "Unpin"
- assertVisible: "Pin"
# copy, then paste into the draft
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 20000
- tapOn: "Paste"
- tapOn:
    text: "Allow Paste"
    optional: true
- extendedWaitUntil:
    visible: ".*Maestro clip edited.*"
    timeout: 20000
- tapOn:
    id: "clipboard.draft"
- eraseText: 40
# (No keyboard dismissal here — the draft is re-focused immediately.)
# a second clip so cut/delete each act on one
- tapOn:
    id: "clipboard.draft"
- inputText: "Maestro clip two"
# No hideKeyboard (fails here); "Save text" sits directly under the
# focused draft field at the top of the screen, above the keyboard.
- tapOn: "Save text"
- extendedWaitUntil:
    visible: ".*Maestro clip two.*"
    timeout: 20000
- takeScreenshot: 03-clipboard-two-clips
# cut the newest (top) clip: removed from the list, now on the clipboard
- tapOn:
    text: "Cut"
    index: 0
- extendedWaitUntil:
    visible: "Cut — it’s on your clipboard"
    timeout: 20000
- extendedWaitUntil:
    visible: "On your clipboard now"
    timeout: 20000
- tapOn: "Save it"
- extendedWaitUntil:
    visible: "Saved to clipboard history"
    timeout: 20000
# delete one
- tapOn:
    text: "Delete"
    index: 0
- takeScreenshot: 03-clipboard-done
