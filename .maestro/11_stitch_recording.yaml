appId: app.everytool.ios
name: Long screenshot from a finished screen recording (auto-open + auto-stitch)
---
# The driver has written 8 frames + index.json {finished:true} into the
# App Group's BroadcastInbox, exactly as targets/broadcast does. Bringing
# the app to the foreground must open the stitcher and stitch by itself.
- launchApp
- extendedWaitUntil:
    visible: "Your long screenshot"
    timeout: 180000
# Same viewport issue as the photo flow: scroll the size line into view.
- scrollUntilVisible:
    element:
      text: "1170 × 6732 px.*"
    direction: DOWN
    timeout: 20000
- assertVisible: "1170 × 6732 px.*"
- scrollUntilVisible:
    element:
      text: "1 unchanged frames skipped.*"
    direction: DOWN
    timeout: 20000
- assertVisible: "1 unchanged frames skipped.*"
- takeScreenshot: 11-stitch-recording
- scrollUntilVisible:
    element:
      text: "View full length"
    direction: DOWN
    timeout: 20000
# Let scroll momentum settle so the tap lands on the button, then
# prove the viewer opened via its close control: the button's visible
# text is "Done" but its accessibility label is "Close" (the text
# folds into the Pressable), and the dims regex also matches the
# result card's "1170 × 6732 px · …" line, so it cannot prove the
# viewer opened — that is why run 39363490145 died at tapOn "Done".
- waitForAnimationToEnd
- tapOn: "View full length"
- extendedWaitUntil:
    visible: "Close"
    timeout: 60000
- assertVisible: "1170 × 6732"
- scroll
- scroll
- takeScreenshot: 11-stitch-full-length
# hide a private area (feature pass): drag a box, Apply re-writes
# the PNG pixelated. Exit afterwards with the repo-proven "Close"
# (the viewer's close control — its visible text is "Done",
# which run 39363490145 proved cannot be tapped by that name).
- tapOn: "Hide details"
- assertVisible: "Drag over anything private"
- swipe:
    start: 15%, 40%
    end: 85%, 48%
    duration: 600
- tapOn: "Apply"
# The "Hid N area" confirmation is an app-level toast, which renders
# UNDER the viewer's Modal window — it can never become visible from
# inside the viewer (run 39377689237 timed out on exactly that wait).
# Prove Apply completed by the toolbar instead: while hiding, the
# toolbar shows Cancel/Apply; "Hide details" only returns after a
# successful Apply exits hiding mode — the no-rect path notifies and
# stays in hiding mode, so this wait still catches a lost swipe.
- extendedWaitUntil:
    visible: "Hide details"
    timeout: 60000
- takeScreenshot: 11-stitch-hidden
- tapOn: "Close"
- scrollUntilVisible:
    element:
      text: "Save to Photos"
    direction: DOWN
    timeout: 20000
- tapOn: "Save to Photos"
# 120s (was 20s, then 60s): in run 6ad827f8 the tap is log-proven to
# have landed on stitch.save, yet neither the "Saved to Photos" toast
# nor an error appeared within 20s (sibling saves in flows 07/10
# confirmed fine). The 60s wait then passed four straight runs
# (6ad8302e–6ad84534) and missed once in 6ad84f01 on an otherwise
# fast instance, with the correctly stitched image on screen — the
# save's tail latency varies with simulator/Photos load. 120s
# covers that tail; a genuine save failure stays red at any wait.
- extendedWaitUntil:
    visible: "Saved to Photos"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: "Copy image"
    direction: DOWN
    timeout: 20000
- tapOn: "Copy image"
- extendedWaitUntil:
    visible: "Copied"
    timeout: 20000
